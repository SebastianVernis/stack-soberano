services:
  activepieces:
    image: activepieces/activepieces:latest
    restart: unless-stopped
    environment:
      AP_FRONTEND_URL: ${AP_FRONTEND_URL}
      AP_JWT_SECRET: ${AP_JWT_SECRET}
      AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY}
      AP_POSTGRES_HOST: postgres
      AP_POSTGRES_PORT: "5432"
      AP_POSTGRES_DATABASE: ${ACTIVEPIECES_DB}
      AP_POSTGRES_USER: ${POSTGRES_USER}
      AP_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AP_TELEMETRY_ENABLED: "false"
    volumes:
      - activepieces_data:/root/.activepieces
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - postgres

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command: ["gotenberg", "--api-timeout=120s"]
    ports:
      - "127.0.0.1:3001:3000"

  carbone:
    image: carbone/carbone-ee:latest
    restart: unless-stopped
    environment:
      CARBONE_API_KEY: ${CARBONE_API_KEY}
    ports:
      - "127.0.0.1:4000:4000"

  metabase:
    image: metabase/metabase:latest
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: ${METABASE_DB}
      MB_DB_USER: ${POSTGRES_USER}
      MB_DB_PASS: ${POSTGRES_PASSWORD}
    volumes:
      - metabase_data:/metabase-data
    ports:
      - "127.0.0.1:3030:3000"
    depends_on:
      - postgres

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  comfyui:
    image: comfyanonymous/comfyui:latest
    restart: unless-stopped
    volumes:
      - comfyui_data:/workspace
    ports:
      - "127.0.0.1:8188:8188"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # Plane CE se despliega con su compose oficial (multi-servicio) unido a la red
  # stack-soberano; no se replica aquí para evitar una configuración incompleta.

volumes:
  activepieces_data:
  metabase_data:
  minio_data:
  comfyui_data:

networks:
  default:
    name: stack-soberano
    external: true
